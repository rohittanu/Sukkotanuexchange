name: Build SUKKO APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Prepare Website
        run: |
          unzip -o Property-Marketplace.zip -d temp
          mkdir -p www
          # jo bhi dist/build folder mile use lelo, nahi to index.html wala folder
          FOUND=$(find temp -type d -name "dist" | head -1)
          if [ -n "$FOUND" ]; then cp -r $FOUND/* www/; else cp -r temp/Property-Marketplace/* www/ 2>/dev/null || cp -r temp/* www/; fi
          ls www | head -20
      - name: Fix localhost
        run: |
          sed -i 's|https://localhost|.|g' www/index.html || true
          sed -i 's|http://localhost:5173|.|g' www/index.html || true
          sed -i 's|http://localhost:3000|.|g' www/index.html || true
          sed -i 's|/src/|./src/|g' www/index.html || true
          sed -i 's|src="/|src="./|g' www/index.html || true
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          npm i -g cordova
          cordova create SUKKO com.sukko.app SUKKO
          rm -rf SUKKO/www/*
          cp -r www/* SUKKO/www/
          cd SUKKO
          cordova platform add android
          cordova build android --debug -- --packageType=apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SUKKO-FINAL-APK
          path: SUKKO/platforms/android/app/build/outputs/apk/debug/app-debug.apk
