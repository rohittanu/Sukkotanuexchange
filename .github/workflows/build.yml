name: Build SUKKO APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Prepare and Build Website
        run: |
          unzip -o Property-Marketplace.zip -d temp
          cd temp/Property-Marketplace
          cat pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile
          # Build all except mockup-sandbox
          pnpm --filter=!mockup-sandbox run build || pnpm run build --filter=!mockup-sandbox || echo "trying direct build"
          # Find the main dist
          find. -type d -name "dist" | head -20
          # Assume main app dist is in apps or root
          MAIN_DIST=$(find. -path "*artifacts*" -prune -o -type d -name "dist" -print | grep -v mockup | head -1)
          if [ -z "$MAIN_DIST" ]; then MAIN_DIST=$(find. -type d -name "dist" | grep -v mockup | head -1); fi
          echo "MAIN_DIST=$MAIN_DIST"
          mkdir -p $GITHUB_WORKSPACE/www
          cp -r $MAIN_DIST/* $GITHUB_WORKSPACE/www/
          ls $GITHUB_WORKSPACE/www | head -20
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          npm i -g cordova
          cordova create SUKKO com.sukko.app SUKKO
          rm -rf SUKKO/www/*
          cp -r www/* SUKKO/www/
          cd SUKKO
          cordova platform add android
          cordova build android --debug -- --packageType=apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SUKKO-APK-WORKING
          path: SUKKO/platforms/android/app/build/outputs/apk/debug/app-debug.apk
