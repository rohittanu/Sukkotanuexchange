name: Build SUKKO APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip website
        run: |
          unzip -o Property-Marketplace.zip -d temp-www
          mkdir -p www
          cp -r temp-www/* www/ 2>/dev/null || cp -r temp-www/Property-Marketplace/* www/ || true
          ls www
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Build APK
        run: |
          npm i -g cordova
          cordova create SUKKO com.sukko.app SUKKO
          rm -rf SUKKO/www/*
          cp -r www/* SUKKO/www/
          cd SUKKO
          cordova platform add android
          cordova build android --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SUKKO-APK
          path: SUKKO/platforms/android/app/build/outputs/apk/debug/app-debug.apk
